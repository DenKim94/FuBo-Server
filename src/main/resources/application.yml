spring:
  application:
    name: fubo-app-server
  profiles:
    default: dev
  config:
    # Laedt die lokale .env als Property-Quelle, damit DB_USER/DB_PASSWORD auch beim
    # Start ausserhalb von Docker aufgeloest werden. "optional:" -> kein Fehler, wenn
    # die Datei fehlt (Zielsystem: echte Umgebungsvariablen aus dem Compose-env_file,
    # die ohnehin Vorrang vor Konfigurationsdateien haben).
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fubo}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate      # Schema kommt ausschliesslich von Flyway
    open-in-view: false       # verhindert Lazy-Loading ausserhalb der Service-Schicht
  flyway:
    enabled: true
    schemas: profil, spieltag, configs
    default-schema: public      # Ablageort der Verwaltungstabelle flyway_schema_history
    create-schemas: true
    locations: classpath:db/migration   # Demodaten nur im Testprofil, siehe src/test/resources/application.yml
    validate-on-migrate: true
    # Ein Dateiname, der nicht dem Schema V<nnn>__<beschreibung>.sql entspricht, wird von
    # Flyway per Voreinstellung STILLSCHWEIGEND ignoriert - kein Fehler, kein INFO-Log.
    # Genau so blieb V009_admin_profil.sql (ein Unterstrich) am 22.08.2026 unbemerkt wirkungslos.
    # Mit dieser Einstellung bricht der Start stattdessen mit einer benennenden Meldung ab.
    validate-migration-naming: true
    # Bewusst KEINE Platzhalter (spring.flyway.placeholders). Sie machten die
    # Datenbankmigration von der Anwendungskonfiguration abhaengig: Ein Wert ohne Default
    # laesst schon die Aufloesung scheitern, sobald er aus der Umgebung entfernt wird - und
    # genau das ist fuer ADMIN_PASSWORD und FUBO_INITIAL_PIN nach dem Erststart vorgesehen.
    # Installationsabhaengige Daten entstehen im Bootstrap, nicht in einer Migration.

server:
  forward-headers-strategy: NATIVE   # echte Client-IP hinter nginx (Brute-Force-Schutz)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

fubo:
  # Zeitzone, in der die Anwendung Datums- und Uhrzeitangaben ohne Zeitzone auslegt -
  # allen voran termin.datum und termin.uhrzeit (DATE und TIME, beide ohne Zeitzone).
  # Ohne diesen Wert liefe die Pruefung "Termin in der Vergangenheit" gegen die Zeitzone
  # des Rechners, und die ist in einem Container per Voreinstellung UTC. In Mitteleuropa
  # waeren im Sommer zwei Stunden Unterschied - ein Termin, der schon vorbei ist, liesse
  # sich dann noch anlegen. Der Fehler faellt nicht auf, weil er nur zwei Stunden am Tag
  # betrifft.
  #
  # Zeitpunkte in der Datenbank (TIMESTAMPTZ) sind davon nicht betroffen: Sie tragen ihre
  # Zeitzone selbst.
  zeitzone: Europe/Berlin
  session:
    cookie-name: FUBO_SESSION
    cookie-secure: true
    cookie-same-site: Lax
  brute-force:
    # Drosselung des PIN-Endpunkts. Die Werte entsprechen den Vorgaben im Code
    # (FuboProperties.BruteForce) und stehen hier, damit sie beim Betrieb sichtbar
    # und ohne Neubau anpassbar sind.
    max-versuche-ip: 5          # Fehlversuche je Adresse im Zeitfenster
    max-versuche-global: 30     # Gesamtrate; faengt verteilte Angriffe ab
    fenster-minuten: 15         # danach verfaellt ein Zaehler ohne neuen Fehlversuch
    sperrdauern-minuten:        # steigend; der letzte Wert wiederholt sich
      - 1
      - 5
      - 15
  audit:
    # Loeschfrist des Audit-Logs. Betriebs- und Rechtsgroesse, deshalb Property und nicht
    # Teil der Admin-Konfiguration: Ein Admin soll die Nachvollziehbarkeit seiner eigenen
    # Aenderungen nicht per Formular verkuerzen koennen. Betrifft alle Aktionen
    # gleichermassen; eine nach Aktionsart gestaffelte Frist waere eine Erweiterung des
    # Aufraeumlaufs.
    #
    # Am 12.09.2026 von 90 auf 30 Tage verkuerzt (Vorgabe des Haupt-Entwicklers, S6
    # Abschnitt 0.6): Der Server laeuft auf einem Raspberry Pi, und audit_log ist die
    # einzige Tabelle, die ohne Zutun dauerhaft waechst. Preis: Eine Ergebniskorrektur ist
    # nach 30 Tagen nicht mehr belegbar, ein manueller Generierungslauf (A24) gar nicht
    # mehr nachvollziehbar - er steht nirgends sonst.
    aufbewahrung-tage: 30
  mail:
    # SMTP-Zugang fuer den Versand der Bestaetigungs-PIN beim Passwort-Reset (A22).
    #
    # Bewusst KEIN Vorgabewert fuer Host, Benutzer, Passwort und Absender: Ein Standardwert
    # wie localhost erzeugte eine Anwendung, die im Betrieb Nachrichten ins Leere schickt
    # und das erst im Ernstfall zeigt.
    #
    # Achtung, Fallstrick aus S1: Ein unaufloesbares ${...} wird von Spring Boots Binder
    # WOERTLICH durchgereicht - der Start braeche also nicht ab, die Anwendung liefe mit
    # dem Rechnernamen "${SMTP_HOST}". Deshalb prueft MailConfig die Werte beim Start und
    # bricht mit einer benennenden Meldung ab.
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    benutzer: ${SMTP_USER_NAME}
    passwort: ${SMTP_PASSWORD}
    # Muss zur beim Anbieter freigegebenen Domain gehoeren, sonst lehnt dieser den Versand
    # ab. Erlaubt ist die reine Adresse oder die Form "Anzeigename <adresse@domain>".
    absender: ${SMTP_ABSENDER}
    # Zeitgrenze je Phase (Verbindung, Lesen, Schreiben). Ohne sie haengt ein nicht
    # erreichbarer SMTP-Server den Aufruf unbegrenzt - und mit ihm die Datenbankverbindung,
    # denn der Versand laeuft innerhalb der Transaktion des Reset-Vorgangs.
    zeitgrenze-millis: 5000
  reset:
    # Grenzen des Passwort-Resets. Fuenf Stellen sind fuer sich genommen wenig; tragfaehig
    # wird die Bestaetigungs-PIN erst durch die Summe dieser Grenzen. Keine davon darf
    # entfallen - jede einzelne traegt.
    gueltigkeit-minuten: 15         # Lebensdauer eines Vorgangs
    max-versuche: 5                 # deckt sich mit ck_passwort_reset_versuche (0 bis 5)
    max-anforderungen-pro-stunde: 3 # je Client-Adresse; begrenzt Versand und Rateversuche
    # Loeschfrist der Vorgaenge. Betriebs- und Rechtsgroesse wie beim Audit-Log, aber
    # kuerzer: Der fachliche Beleg steht im Protokoll, hier bleiben nur technische
    # Vorgangsdaten - und angefordert_von_ip ist personenbezogen.
    aufbewahrung-tage: 30
  push:
    # Web Push (A25, S8). Der Server spricht die Push-Dienste der Browserhersteller ueber
    # ausgehendes HTTPS an; es entsteht kein neuer eingehender Endpunkt.
    #
    # ANDERS ALS BEI fubo.mail bricht der Start OHNE diese Werte NICHT ab: PushConfig
    # protokolliert eine Warnung und behandelt Push als abgeschaltet. Der Kernbetrieb laeuft
    # ohne Push vollstaendig, ein Startabbruch waere unverhaeltnismaessig. Sichtbar wird der
    # Zustand an /api/v1/push/schluessel/lesen, das dann mit 503 antwortet.
    #
    # Der Doppelpunkt am Ende der Platzhalter setzt einen leeren Vorgabewert. Ohne ihn
    # reichte Spring Boots Binder die Zeichenkette "${FUBO_VAPID_PUBLIC_KEY}" WOERTLICH
    # durch - PushConfig prueft deshalb zusaetzlich auf unaufgeloeste Platzhalter.
    #
    # Das Schluesselpaar ist das einzige Geheimnis des Projekts, dessen Verlust die NUTZER
    # trifft: Abonnements haengen am oeffentlichen Schluessel, nach einem Wechsel muss jeder
    # Spieler im Browser erneut zustimmen.
    vapid-public-key: ${FUBO_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${FUBO_VAPID_PRIVATE_KEY:}
    # Kontaktadresse des Betreibers als URI nach RFC 8292, ueblich mit mailto:-Praefix. Kein
    # Geheimnis, aber auch keine Formalie: Apple lehnt ein JWT ohne brauchbaren sub-Anspruch
    # mit BadJwtToken ab, und der Fehler faellt NUR auf einem iPhone auf.
    vapid-subject: ${FUBO_VAPID_SUBJECT:}
    # Laeuft der @Scheduled-Auftrag fuer die Terminerinnerung? Im Test auf false, siehe
    # src/test/resources/application.yml.
    erinnerung-aktiv: true
    # Gesamtfrist eines Versandlaufs in Millisekunden. Gesendet wird nebenlaeufig, die
    # Wartezeit ist also das Maximum der Einzelaufrufe und nicht ihre Summe. Der Listener der
    # Terminabsage laeuft synchron im Anfrage-Thread des Admins - ohne diese Frist waeren
    # dreissig Empfaenger im schlechtesten Fall zweieinhalb Minuten Ladekreis.
    versand-frist-millis: 10000
  cors:
    # Kein Default. Fehlt die Variable, bricht der Start ab.
    allowed-origins: ${FUBO_CORS_ALLOWED_ORIGINS}
