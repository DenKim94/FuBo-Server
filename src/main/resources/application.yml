spring:
  application:
    name: fubo-app-server
  profiles:
    default: dev
  config:
    # Laedt die lokale .env als Property-Quelle, damit DB_USER/DB_PASSWORD auch beim
    # Start ausserhalb von Docker aufgeloest werden. "optional:" -> kein Fehler, wenn
    # die Datei fehlt (Zielsystem: echte Umgebungsvariablen aus dem Compose-env_file,
    # die ohnehin Vorrang vor Konfigurationsdateien haben).
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fubo}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate      # Schema kommt ausschliesslich von Flyway
    open-in-view: false       # verhindert Lazy-Loading ausserhalb der Service-Schicht
  flyway:
    enabled: true
    schemas: profil, spieltag, configs
    default-schema: public      # Ablageort der Verwaltungstabelle flyway_schema_history
    create-schemas: true
    locations: classpath:db/migration   # Demodaten nur im Testprofil, siehe src/test/resources/application.yml
    validate-on-migrate: true

server:
  forward-headers-strategy: NATIVE   # echte Client-IP hinter nginx (Brute-Force-Schutz)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

fubo:
  session:
    cookie-name: FUBO_SESSION
    cookie-secure: true
    cookie-same-site: Lax
  brute-force:
    # Drosselung des PIN-Endpunkts. Die Werte entsprechen den Vorgaben im Code
    # (FuboProperties.BruteForce) und stehen hier, damit sie beim Betrieb sichtbar
    # und ohne Neubau anpassbar sind.
    max-versuche-ip: 5          # Fehlversuche je Adresse im Zeitfenster
    max-versuche-global: 30     # Gesamtrate; faengt verteilte Angriffe ab
    fenster-minuten: 15         # danach verfaellt ein Zaehler ohne neuen Fehlversuch
    sperrdauern-minuten:        # steigend; der letzte Wert wiederholt sich
      - 1
      - 5
      - 15
  audit:
    # Loeschfrist des Audit-Logs. Betriebs- und Rechtsgroesse, deshalb Property und nicht
    # Teil der Admin-Konfiguration. Betrifft alle Aktionen gleichermassen; eine nach
    # Aktionsart gestaffelte Frist waere eine Erweiterung des Aufraeumjobs.
    aufbewahrung-tage: 90
  cors:
    # Kein Default. Fehlt die Variable, bricht der Start ab.
    allowed-origins: ${FUBO_CORS_ALLOWED_ORIGINS}