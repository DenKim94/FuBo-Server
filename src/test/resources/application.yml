# Testkonfiguration - ergaenzt und ueberschreibt src/main/resources/application.yml.
spring:
  datasource:
    # Platzhalterwerte. Die tatsaechliche Verbindung liefert Testcontainers ueber
    # @ServiceConnection und hat Vorrang. Ohne diese Eintraege scheitert die
    # Aufloesung von ${DB_USER}/${DB_PASSWORD}, sobald die Variablen nicht in der
    # Umgebung stehen - der Kontext startet dann gar nicht erst.
    username: test
    password: test
  flyway:
    # Zusaetzlich zu den Schemamigrationen die anonymisierten Beispielprofile laden.
    # In der Produktionskonfiguration steht bewusst nur classpath:db/migration.
    locations: classpath:db/migration, classpath:db/demodata

fubo:
  session:
    # Feste Testwerte statt ${FUBO_...}: Der Testlauf darf nicht davon abhaengen, ob
    # lokal eine .env existiert - sonst ist er auf dem Entwicklungsrechner gruen und
    # in einer CI-Umgebung rot.
    cookie-name: FUBO_SESSION
    cookie-secure: false
    cookie-same-site: Lax
  brute-force:
    # Dieselben Werte wie in der Produktionskonfiguration - der Test soll das echte
    # Verhalten pruefen, nicht ein entschaerftes. Damit die Zaehler eines Testlaufs
    # nicht in den naechsten hineinwirken, setzt jeder Test sie ueber
    # BruteForceService#alleZuruecksetzen zurueck.
    max-versuche-ip: 5
    max-versuche-global: 30
    fenster-minuten: 15
    sperrdauern-minuten:
      - 1
      - 5
      - 15
  audit:
    # Wie in der Produktionskonfiguration. Der Test zur Loeschfrist setzt die Zeitstempel
    # der Pruefdaten direkt, statt die Frist zu verkuerzen - das haelt den Test unabhaengig
    # vom konfigurierten Wert.
    aufbewahrung-tage: 90
  mail:
    # Feste Testwerte statt ${SMTP_...}: Der Testlauf darf nicht davon abhaengen, ob lokal
    # eine .env existiert. Es wird nichts versendet - der Fachlogiktest tauscht den
    # JavaMailSender gegen einen Ersatz aus; die Bean existiert nur, damit der Kontext
    # startet. "example.invalid" ist nach RFC 2606 garantiert nicht zustellbar.
    host: smtp.example.invalid
    port: 587
    benutzer: test
    passwort: test
    absender: FuBo-Test <noreply@example.invalid>
    zeitgrenze-millis: 5000
  reset:
    # Dieselben Werte wie in der Produktionskonfiguration - der Test soll das echte
    # Verhalten pruefen, nicht ein entschaerftes. Ablaufzeitpunkte setzen die Tests direkt
    # per JdbcTemplate, statt die Gueltigkeit zu verkuerzen.
    gueltigkeit-minuten: 15
    max-versuche: 5
    max-anforderungen-pro-stunde: 3
    # Wie in der Produktionskonfiguration. Der Test zur Loeschfrist setzt die Zeitstempel
    # der Pruefdaten direkt, statt die Frist zu verkuerzen - das haelt ihn unabhaengig vom
    # konfigurierten Wert.
    aufbewahrung-tage: 30
  cors:
    allowed-origins: http://localhost:5173

# Admin-Konto fuer den AdminBootstrap (Abschnitt 9). Ohne diese drei Werte braeche der
# Start ab und kein einziger @SpringBootTest kaeme hoch - der Bootstrap laesst bewusst
# keine unvollstaendige Konfiguration durch.
#
# "Beispielspieler 12" ist bewusst gewaehlt: Die Testklassen greifen ueber
# "ORDER BY name LIMIT 1" bzw. "OFFSET 1" auf die ersten beiden Profile zu und erwarten
# dort die Rolle USER. Der letzte Eintrag der Demodaten kollidiert damit nicht.
# Die Adresse ist eine Beispieladresse nach RFC 2606 und existiert nicht.
ADMIN_NAME: Beispielspieler 12
ADMIN_EMAIL: admin@example.invalid
ADMIN_PASSWORD: test-admin-passwort
