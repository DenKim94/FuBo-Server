# Testkonfiguration - ergaenzt und ueberschreibt src/main/resources/application.yml.
spring:
  datasource:
    # Platzhalterwerte. Die tatsaechliche Verbindung liefert Testcontainers ueber
    # @ServiceConnection und hat Vorrang. Ohne diese Eintraege scheitert die
    # Aufloesung von ${DB_USER}/${DB_PASSWORD}, sobald die Variablen nicht in der
    # Umgebung stehen - der Kontext startet dann gar nicht erst.
    username: test
    password: test
  flyway:
    # Zusaetzlich zu den Schemamigrationen die anonymisierten Beispielprofile laden.
    # In der Produktionskonfiguration steht bewusst nur classpath:db/migration.
    locations: classpath:db/migration, classpath:db/demodata

fubo:
  session:
    # Feste Testwerte statt ${FUBO_...}: Der Testlauf darf nicht davon abhaengen, ob
    # lokal eine .env existiert - sonst ist er auf dem Entwicklungsrechner gruen und
    # in einer CI-Umgebung rot.
    cookie-name: FUBO_SESSION
    cookie-secure: false
    cookie-same-site: Lax
  cors:
    allowed-origins: http://localhost:5173
