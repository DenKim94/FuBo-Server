services:
  fubo-db-dev:
    image: postgres:17
    container_name: fubo_db_dev
    environment:
      POSTGRES_DB: fubo
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fubo_db_dev_data:/var/lib/postgresql/data

volumes:
  fubo_db_dev_data: